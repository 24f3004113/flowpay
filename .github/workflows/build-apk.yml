name: Build Installable APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  apk:
    name: Build and publish installable APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease -PallowUnsigned --no-daemon --stacktrace

      - name: Prepare signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${KEYSTORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > release-key.jks
            echo "Using the repository's persistent release key."
          else
            echo "No release-key secrets configured; creating a temporary key for this build."
            keytool -genkeypair -v \
              -keystore release-key.jks \
              -storepass temporary-build-password \
              -keypass temporary-build-password \
              -alias flowpay \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Flowpay Build"
            {
              echo "KEYSTORE_PASSWORD=temporary-build-password"
              echo "KEY_ALIAS=flowpay"
              echo "KEY_PASSWORD=temporary-build-password"
            } >> "$GITHUB_ENV"
          fi

      - name: Sign APK
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f | head -1)
          test -n "$APK"
          if [ -n "${KEYSTORE_B64:-}" ]; then
            KS_PASS="$KEYSTORE_PASSWORD"
            ALIAS="$KEY_ALIAS"
            KEY_PASS="$KEY_PASSWORD"
          else
            KS_PASS="${KEYSTORE_PASSWORD:-temporary-build-password}"
            ALIAS="${KEY_ALIAS:-flowpay}"
            KEY_PASS="${KEY_PASSWORD:-temporary-build-password}"
          fi

          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$ZIPALIGN" -f -p 4 "$APK" app/build/outputs/apk/release/flowpay-release-aligned.apk
          "$APKSIGNER" sign \
            --ks release-key.jks \
            --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --ks-key-alias "$ALIAS" \
            --out app/build/outputs/apk/release/Flowpay.apk \
            app/build/outputs/apk/release/flowpay-release-aligned.apk
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/Flowpay.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Flowpay-APK
          path: app/build/outputs/apk/release/Flowpay.apk
          if-no-files-found: error
          retention-days: 30
